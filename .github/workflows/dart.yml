name: Build AZ Store Offline APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files
        run: flutter create . --platforms=android

      - name: Set Android app display name
        run: sed -i 's/android:label="az_store"/android:label="AZ Store"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZ-Store-Offline-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
